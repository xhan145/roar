<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROAR Live Transcript</title>
<style>
  :root{
    --bg:#08080D; --surface:rgba(255,255,255,.05); --field:#14141C;
    --text:#EDEDF2; --muted:#A2A5B4; --border:rgba(255,255,255,.12);
    --accent:#A78BFA; --accent-ink:#0B0B10; --ok:#5BD6A0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);height:100vh;display:flex;
    flex-direction:column;font:400 14px/1.55 Inter,system-ui,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  header{padding:10px 12px;border-bottom:1px solid var(--border);display:grid;gap:8px;
    background:rgba(255,255,255,.03)}
  .rowbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .tr-chip{background:var(--field);border:1px solid var(--border);color:var(--muted);
    border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    min-height:30px;transition:color .15s,border-color .15s}
  .tr-chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);
    border-color:var(--accent)}
  .btn{background:var(--field);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    min-height:30px}
  .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);
    border-color:var(--accent)}
  #tr-search{flex:1;min-width:120px;background:var(--field);border:1px solid var(--border);
    border-radius:8px;padding:6px 10px;color:var(--text);font-size:13px}
  main{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .row{background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:8px 12px}
  .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:11.5px;
    margin-bottom:2px}
  .tag{background:rgba(167,139,250,.16);color:var(--accent);border-radius:5px;
    padding:1px 7px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
  .copy{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:11.5px;padding:2px 6px;border-radius:6px}
  .copy:hover{color:var(--text);background:var(--field)}
  .hint{color:var(--muted);text-align:center;margin:auto;padding:24px;font-size:13.5px}
  .hint b{color:var(--text)}
  #tr-status{color:var(--muted);font-size:11.5px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="rowbar" role="group" aria-label="Source filter">
    <button class="tr-chip" data-source="all" aria-pressed="true">All</button>
    <button class="tr-chip" data-source="dictation" aria-pressed="false">Dictation</button>
    <button class="tr-chip" data-source="capture" aria-pressed="false">Capture</button>
    <span id="tr-status" aria-live="polite"></span>
  </div>
  <div class="rowbar">
    <input id="tr-search" type="search" placeholder="Search…" aria-label="Search transcript">
    <button class="btn" id="tr-ontop" aria-pressed="false" title="Keep this window above others">On top</button>
    <button class="btn" id="tr-export" title="Save the current view to a text file">Export</button>
  </div>
</header>
<main id="tr-list" aria-label="Live transcript"></main>

<script>
const api = () => window.pywebview.api;
let source = "all";
let pinned = true;          // auto-scroll to newest unless the user scrolled up
let lastKey = "";

function fmt(ts) {
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) +
    " · " + d.toLocaleDateString([], {month: "short", day: "numeric"});
}

async function refresh() {
  let data;
  try {
    const state = await api().state();
    if (!state.history_enabled) {
      render([], "History is turned <b>off</b>, so there is nothing to show. " +
                 "Enable it in Settings → Privacy & History controls.");
      return;
    }
    data = await api().transcript_list(source, document.getElementById("tr-search").value || null);
  } catch (e) {
    render([], "Couldn't read the transcript — retrying…");
    return;
  }
  const rows = data.rows.slice().reverse();   // oldest→newest, chat style
  const key = rows.length + ":" + (rows.length ? rows[rows.length-1].id : 0) + ":" + source;
  document.getElementById("tr-status").textContent = rows.length ? rows.length + " lines" : "";
  if (key === lastKey) return;                // nothing changed: don't redraw
  lastKey = key;
  render(rows, rows.length ? null :
    "Nothing yet. Dictate something, or turn on <b>Meeting capture</b> from the tray.");
}

function render(rows, emptyHtml) {
  const list = document.getElementById("tr-list");
  list.innerHTML = "";
  if (!rows.length) {
    const e = document.createElement("div");
    e.className = "hint";
    e.innerHTML = emptyHtml || "Nothing yet.";
    list.appendChild(e);
    return;
  }
  rows.forEach(r => {
    const row = document.createElement("div"); row.className = "row";
    const meta = document.createElement("div"); meta.className = "meta";
    const when = document.createElement("span"); when.textContent = fmt(r.ts_utc);
    meta.appendChild(when);
    if (r.capture) {
      const tag = document.createElement("span");
      tag.className = "tag"; tag.textContent = "CAPTURE";
      meta.appendChild(tag);
    }
    const copy = document.createElement("button");
    copy.className = "copy"; copy.textContent = "Copy";
    copy.setAttribute("aria-label", "copy this line");
    copy.onclick = () => navigator.clipboard.writeText(r.text);
    meta.appendChild(copy);
    const txt = document.createElement("div"); txt.textContent = r.text;
    row.append(meta, txt);
    list.appendChild(row);
  });
  if (pinned) list.scrollTop = list.scrollHeight;
}

document.getElementById("tr-list").addEventListener("scroll", () => {
  const l = document.getElementById("tr-list");
  pinned = l.scrollTop + l.clientHeight >= l.scrollHeight - 40;
});
document.querySelectorAll(".tr-chip").forEach(chip => chip.addEventListener("click", () => {
  document.querySelectorAll(".tr-chip").forEach(c => c.setAttribute("aria-pressed", "false"));
  chip.setAttribute("aria-pressed", "true");
  source = chip.dataset.source;
  lastKey = ""; pinned = true;
  refresh();
}));
document.getElementById("tr-search").addEventListener("input", () => { lastKey = ""; refresh(); });
document.getElementById("tr-ontop").addEventListener("click", async () => {
  const btn = document.getElementById("tr-ontop");
  const want = btn.getAttribute("aria-pressed") !== "true";
  const r = await api().set_on_top(want);
  if (r.ok) btn.setAttribute("aria-pressed", String(want));
});
document.getElementById("tr-export").addEventListener("click", async () => {
  const r = await api().transcript_export(source, document.getElementById("tr-search").value || null);
  document.getElementById("tr-status").textContent =
    r.error ? r.error : ("Exported " + r.count + " lines");
});

let timer = null;
function startPolling() {
  if (timer) return;
  timer = setInterval(refresh, 1500);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearInterval(timer); timer = null; }
  else startPolling();
});
window.addEventListener("pywebviewready", () => { refresh(); startPolling(); });
</script>
</body>
</html>
